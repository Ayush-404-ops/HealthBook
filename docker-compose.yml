version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-healthbook_analytics}
      POSTGRES_USER: ${DB_USER:-hb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hb_secure_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hb_user} -d ${DB_NAME:-healthbook_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
